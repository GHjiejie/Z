name: agent-permissions

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGENT_USERS_POSTGRES_DB:-agent_users}
      POSTGRES_USER: ${AGENT_USERS_POSTGRES_USER:-agent_users}
      POSTGRES_PASSWORD: ${AGENT_USERS_POSTGRES_PASSWORD:?Generate deploy/.env with setup_postgres first}
    ports:
      - "127.0.0.1:${AGENT_USERS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
