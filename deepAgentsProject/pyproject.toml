[project]
name = "deepagent-platform"
version = "0.1.0"
description = "Runnable Phase 1 implementation of the DeepAgent Platform architecture"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "alibabacloud-credentials>=1,<2",
  "alibabacloud-oss-v2>=1.2,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "deepagents==0.7.11",
  "langchain==1.3.18",
  "langchain-openai==1.6.0",
  "langchain-anthropic==1.7.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "docker==7.2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
