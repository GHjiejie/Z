[project]
name = "deepagent-platform"
version = "0.1.0"
description = "Runnable Phase 1 implementation of the DeepAgent Platform architecture"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "alibabacloud-credentials>=1,<2",
  "alibabacloud-oss-v2>=1.2,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "psutil==7.2.2",
  "deepagents==0.7.11",
  "langchain==1.3.18",
  "langchain-openai==1.6.0",
  "langchain-anthropic==1.7.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langgraph-checkpoint-postgres==3.1.2",
  "psycopg[binary,pool]==3.3.4",
  "docker==7.2.0",
  "prometheus-client>=0.22,<1",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "cryptography>=46,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# Application sources are copied into release images, not installed editable.
package = false

[dependency-groups]
delivery = ["uv==0.11.16", "pip-audit>=2.9,<3"]
build = ["pip>=25,<27", "setuptools>=80,<83", "wheel>=0.45,<1"]
