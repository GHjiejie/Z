name: API tool contract acceptance

on:
  pull_request:
    paths: ['api_tools/**', 'agent_permissions/**', 'pyproject.toml', 'uv.lock', '.github/workflows/api-tools.yml']
  push:
    paths: ['api_tools/**', 'agent_permissions/**', 'pyproject.toml', 'uv.lock', '.github/workflows/api-tools.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install shared locked environment
        run: |
          python -m pip install uv
          uv sync --locked
      - name: Build and verify API tool bundle
        run: |
          uv run python -m agent_permissions.tools build
          uv run python -m agent_permissions.tools check
      - name: Compare with previous API contract when available
        shell: bash
        run: |
          if [ -n "$BASE_REVISION" ] && git cat-file -e "$BASE_REVISION:agent_permissions/tools.py" 2>/dev/null; then
            baseline_checkout=$(mktemp -d)
            git archive "$BASE_REVISION" api_tools agent_permissions | tar -x -C "$baseline_checkout"
            (cd "$baseline_checkout" && "$GITHUB_WORKSPACE/.venv/bin/python" -m agent_permissions.tools build --output "$RUNNER_TEMP/api-tools-baseline.json")
            if [ -f agent_permissions/tool-release.json ]; then
              uv run python -m agent_permissions.tools diff --baseline "$RUNNER_TEMP/api-tools-baseline.json" --compatibility agent_permissions/tool-release.json
            else
              uv run python -m agent_permissions.tools diff --baseline "$RUNNER_TEMP/api-tools-baseline.json"
            fi
          else
            echo 'No previous tool compiler exists; checking initial coverage and execution.'
          fi
      - name: Offline tool and API regression tests
        run: >-
          uv run python -m unittest
          api_tools.test_tools agent_permissions.test_tools
          agent_permissions.test_chat_model
          agent_permissions.test_chat_api
          agent_permissions.test_tracing
          agent_permissions.test_hitl
          agent_permissions.test_api agent_permissions.test_rbac agent_permissions.test_console
          agent_permissions.test_agent_grants
          agent_permissions.test_connection_pool.PoolConfigurationTests
          agent_permissions.test_connection_pool.DatabaseLifecycleTests -v
      - name: Python checks
        run: |
          uv run ruff check api_tools agent_permissions
          uv run ruff format --check api_tools agent_permissions
