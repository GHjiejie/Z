name: DeepAgent release acceptance

on:
  pull_request:
    paths: ['deepAgentsProject/**', '.github/workflows/deepagent-release.yml']
  push:
    paths: ['deepAgentsProject/**', '.github/workflows/deepagent-release.yml']
  workflow_dispatch:

# Never execute PR code with deployment/publishing secrets or a persistent host.
permissions:
  contents: read
concurrency:
  group: deepagent-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: deepAgentsProject
    services:
      postgres:
        image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_DB: integration
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U integration -d integration"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DEEPAGENT_TEST_POSTGRES_URL: postgresql://integration:disposable-ci-only@127.0.0.1:5432/integration
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install hash-locked tools and dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.build.lock
          python -m pip install --require-hashes --only-binary=:all: --no-binary=alibabacloud-tea --no-build-isolation -r requirements.txt -r requirements.tools.lock
          python -m pip check
          python scripts/release.py locks
      - name: Frontend tests and build from lockfile
        run: |
          npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/web test
          npm --prefix apps/web run build
      - name: Build verified matching PostgreSQL backup clients
        run: |
          client_root=$(mktemp -d)
          python scripts/build_postgres_clients.py --output "$client_root/clients"
          printf '%s\n' "$client_root/clients/bin" >> "$GITHUB_PATH"
      - name: SQLite and real PostgreSQL integration gate
        run: python -m packages.operations.integration_checks platform
      - name: Real Docker execution and recovery gate
        run: python -m packages.operations.integration_checks docker
      - name: Verified Prometheus alert firing and recovery gate
        run: |
          tool_dir=$(mktemp -d)
          curl --proto '=https' --proto-redir '=https' --fail --location --connect-timeout 10 --max-time 180 --output "$tool_dir/prometheus.tar.gz" https://github.com/prometheus/prometheus/releases/download/v3.13.2/prometheus-3.13.2.linux-amd64.tar.gz
          printf '%s  %s\n' '0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f' "$tool_dir/prometheus.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/prometheus.tar.gz" -C "$tool_dir" prometheus-3.13.2.linux-amd64/promtool
          python scripts/monitoring_checks.py --promtool "$tool_dir/prometheus-3.13.2.linux-amd64/promtool"
      - name: Build production images and run native isolation gate
        run: python scripts/release.py images --revision "$RELEASE_REVISION"
      - name: Vulnerability and source-secret gates plus SBOM
        run: python scripts/release.py scan --revision "$RELEASE_REVISION"
      - name: Upload acceptance metadata, never images or credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deepagent-release-evidence-${{ github.sha }}
          path: deepAgentsProject/.release/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
